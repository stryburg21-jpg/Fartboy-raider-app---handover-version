<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="100%" height="100%">
  <defs>
    <!-- 3D GOLDEN FUR GRADIENT -->
    <radialGradient id="fur3D" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="45%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </radialGradient>

    <linearGradient id="goldMedal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="petShadow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- PET LAYER: 3D GOLDEN BULLDOG / DOG COMPANION (SITTING BESIDE FEET Y=320..458, X=260..368) -->
  <g id="pet-3d-layer" filter="url(#petShadow3D)">
    <!-- Ground Shadow Under Dog Base -->
    <ellipse cx="318" cy="452" rx="42" ry="12" fill="#000000" opacity="0.6"/>

    <!-- Tail (Wagging) -->
    <path d="M 345 420 Q 368 385 358 375 Q 348 370 342 398 Z" fill="url(#fur3D)" stroke="#854d0e" stroke-width="2"/>

    <!-- Dog Torso & Haunches -->
    <ellipse cx="320" cy="425" rx="32" ry="26" fill="url(#fur3D)" stroke="#854d0e" stroke-width="2.5"/>

    <!-- Dog Front Legs -->
    <rect x="280" y="414" width="16" height="36" rx="7" fill="url(#fur3D)" stroke="#854d0e" stroke-width="2"/>
    <rect x="302" y="414" width="16" height="36" rx="7" fill="url(#fur3D)" stroke="#854d0e" stroke-width="2"/>

    <!-- Paws -->
    <ellipse cx="288" cy="448" rx="11" ry="7" fill="#ca8a04" stroke="#854d0e" stroke-width="1.5"/>
    <ellipse cx="310" cy="448" rx="11" ry="7" fill="#ca8a04" stroke="#854d0e" stroke-width="1.5"/>

    <!-- Dog Head 3D -->
    <circle cx="295" cy="374" r="28" fill="url(#fur3D)" stroke="#854d0e" stroke-width="2.5"/>

    <!-- Pointy Ears 3D -->
    <path d="M 274 358 L 262 320 L 284 350 Z" fill="url(#fur3D)" stroke="#854d0e" stroke-width="2"/>
    <path d="M 270 350 L 266 328 L 280 345 Z" fill="#ca8a04"/>

    <path d="M 316 358 L 328 320 L 306 350 Z" fill="url(#fur3D)" stroke="#854d0e" stroke-width="2"/>
    <path d="M 320 350 L 324 328 L 310 345 Z" fill="#ca8a04"/>

    <!-- Cool Boss Sunglasses -->
    <polygon points="270,362 320,362 314,380 276,380" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/>
    <line x1="282" y1="364" x2="308" y2="364" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Snout & Nose -->
    <ellipse cx="295" cy="388" rx="11" ry="9" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
    <ellipse cx="295" cy="383" rx="5" ry="3.5" fill="#020617"/>

    <!-- Heavy Gold Chain with FARTBOY Medal -->
    <path d="M 274 396 Q 295 412 316 396" fill="none" stroke="url(#goldMedal)" stroke-width="3.5"/>
    <circle cx="295" cy="408" r="7" fill="url(#goldMedal)" stroke="#78350f" stroke-width="1.5"/>
    <circle cx="295" cy="408" r="4" fill="#0f172a"/>
  </g>
</svg>

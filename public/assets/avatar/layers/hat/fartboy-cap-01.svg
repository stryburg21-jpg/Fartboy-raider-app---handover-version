<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="100%" height="100%">
  <defs>
    <!-- 3D CAP GRADIENTS & HIGHLIGHTS -->
    <radialGradient id="capDome3D" cx="35%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="40%" stop-color="#a855f7"/>
      <stop offset="80%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </radialGradient>

    <linearGradient id="visor3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>

    <filter id="hatShadow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="4.5" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- HAT LAYER (FITS HEAD Y=70..138, X=130..270) -->
  <g id="hat-3d-layer" filter="url(#hatShadow3D)">
    <!-- Ambient Occlusion Shadow Cast onto Forehead -->
    <path d="M 142 128 C 160 138, 240 138, 258 128 C 240 144, 160 144, 142 128 Z" fill="#000000" opacity="0.45"/>

    <!-- Main Cap Dome -->
    <path d="M 142 126 C 138 90, 168 68, 200 68 C 232 68, 262 90, 258 126 Z" fill="url(#capDome3D)" stroke="#3b0764" stroke-width="3"/>

    <!-- Cap Dome Specular Highlight -->
    <path d="M 160 90 Q 185 76 210 82" stroke="#e9d5ff" stroke-width="2.5" fill="none" opacity="0.6" stroke-linecap="round"/>

    <!-- Seam Lines on Cap -->
    <path d="M 200 68 L 200 126 M 165 82 L 182 126 M 235 82 L 218 126" stroke="#581c87" stroke-width="1.5" opacity="0.6" fill="none"/>

    <!-- Front Cap Visor/Brim (3D Curved Visor) -->
    <path d="M 134 123 C 170 114, 230 114, 276 130 C 286 134, 276 146, 254 142 C 210 134, 160 134, 134 130 Z" fill="url(#visor3D)" stroke="#831843" stroke-width="2.5"/>
    <!-- Visor Highlight Edge -->
    <path d="M 138 125 C 170 118, 230 118, 272 132" stroke="#fbcfe8" stroke-width="1.5" fill="none" opacity="0.8"/>

    <!-- Metallic Gold Crown Button -->
    <ellipse cx="200" cy="69" rx="9" ry="5" fill="#fbbf24" stroke="#78350f" stroke-width="1.5"/>
    <ellipse cx="198" cy="68" rx="3" ry="1.5" fill="#ffffff" opacity="0.8"/>

    <!-- Front Metallic Emblem Badge -->
    <circle cx="200" cy="100" r="14" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/>
    <circle cx="200" cy="100" r="12" fill="none" stroke="#34d399" stroke-width="1"/>
    <text x="200" y="105" font-family="monospace" font-weight="900" font-size="13" fill="#fbbf24" text-anchor="middle">F</text>
  </g>
</svg>

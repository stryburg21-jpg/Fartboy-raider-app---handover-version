<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="100%" height="100%">
  <defs>
    <!-- 3D VELVET / SILK CAPE GRADIENTS -->
    <radialGradient id="capeBody3D" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="45%" stop-color="#7e22ce"/>
      <stop offset="85%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </radialGradient>

    <linearGradient id="goldClasp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <filter id="capeShadow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- CAPE LAYER (RENDERED BEHIND CHARACTER Y=180..425, X=70..330) -->
  <g id="cape-3d-layer" filter="url(#capeShadow3D)">
    <!-- Main Flowing Cape Silhouette -->
    <path d="M 160 185 C 130 185, 85 260, 70 422 C 128 444, 180 418, 200 428 C 220 418, 272 444, 330 422 C 315 260, 270 185, 240 185 C 215 200, 185 200, 160 185 Z" fill="url(#capeBody3D)" stroke="#3b0764" stroke-width="2.5"/>

    <!-- 3D Fold Creases & Deep Shading Lines -->
    <path d="M 160 185 Q 138 300 110 422 Q 148 432 170 420 Q 185 280 180 195 Z" fill="#3b0764" opacity="0.6"/>
    <path d="M 240 185 Q 262 300 290 422 Q 252 432 230 420 Q 215 280 220 195 Z" fill="#3b0764" opacity="0.6"/>

    <!-- Silk Sheen Highlights on Outer Folds -->
    <path d="M 85 300 Q 80 370 110 420" stroke="#c084fc" stroke-width="2.5" fill="none" opacity="0.5"/>
    <path d="M 315 300 Q 320 370 290 420" stroke="#c084fc" stroke-width="2.5" fill="none" opacity="0.5"/>

    <!-- Metallic Gold Shoulder Collar Band -->
    <path d="M 150 185 C 180 198, 220 198, 250 185 L 246 197 C 218 210, 182 210, 154 197 Z" fill="url(#goldClasp)" stroke="#78350f" stroke-width="1.5"/>

    <!-- Gold Gemstone Clasps -->
    <circle cx="154" cy="191" r="8" fill="url(#goldClasp)" stroke="#78350f" stroke-width="2"/>
    <circle cx="154" cy="191" r="4" fill="#a855f7"/>

    <circle cx="246" cy="191" r="8" fill="url(#goldClasp)" stroke="#78350f" stroke-width="2"/>
    <circle cx="246" cy="191" r="4" fill="#a855f7"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="100%" height="100%">
  <defs>
    <!-- 3D TOP GRADIENTS & FABRIC FOLDS -->
    <radialGradient id="topBody3D" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="45%" stop-color="#22c55e"/>
      <stop offset="85%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </radialGradient>

    <linearGradient id="trimGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <filter id="topShadow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- TOP / HOODIE LAYER (FITS SHOULDER & TORSO Y=190..312, X=115..285) -->
  <g id="top-3d-layer" filter="url(#topShadow3D)">
    <!-- Ambient Occlusion Shadow Under Shirt Hem onto Shorts/Pants -->
    <path d="M 144 310 L 256 310 L 258 318 L 142 318 Z" fill="#000000" opacity="0.4"/>

    <!-- Main Shirt Body -->
    <path d="M 180 192 C 160 192, 138 200, 134 212 L 115 260 L 140 268 L 144 310 L 256 310 L 260 268 L 285 260 L 266 212 C 262 200, 240 192, 220 192 C 210 205, 190 205, 180 192 Z" fill="url(#topBody3D)" stroke="#052e16" stroke-width="2.5"/>

    <!-- 3D Fabric Folds & Contour Shadows -->
    <path d="M 144 220 Q 155 260 148 305" stroke="#14532d" stroke-width="2.5" fill="none" opacity="0.6"/>
    <path d="M 256 220 Q 245 260 252 305" stroke="#14532d" stroke-width="2.5" fill="none" opacity="0.6"/>
    <path d="M 175 295 Q 200 302 225 295" stroke="#14532d" stroke-width="2" fill="none" opacity="0.5"/>

    <!-- Highlight on Chest & Shoulders -->
    <path d="M 150 205 Q 170 198 185 210" stroke="#bbf7d0" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 250 205 Q 230 198 215 210" stroke="#bbf7d0" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Gold Metallic Collar Trim -->
    <path d="M 176 192 C 188 206, 212 206, 224 192" fill="none" stroke="url(#trimGold)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- CHEST BADGE 3D -->
    <g id="chest-badge-3d">
      <rect x="162" y="224" width="76" height="30" rx="8" fill="#0f172a" stroke="url(#trimGold)" stroke-width="2"/>
      <rect x="164" y="226" width="72" height="26" rx="6" fill="#14532d" opacity="0.8"/>
      <text x="200" y="244" font-family="monospace" font-weight="900" font-size="12" fill="#fbbf24" text-anchor="middle" letter-spacing="1">FARTBOY</text>
      <!-- Badge Glint -->
      <path d="M 166 228 L 180 228 L 170 250 Z" fill="#ffffff" opacity="0.15"/>
    </g>

    <!-- Sleeve Cuffs with Gold Accent -->
    <path d="M 115 260 L 140 268" stroke="url(#trimGold)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 285 260 L 260 268" stroke="url(#trimGold)" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
